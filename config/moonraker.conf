[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/klipper-v3se/printer_data/comms/klippy.sock

[machine]
provider: systemd_cli

[authorization]
trusted_clients:
    127.0.0.1/32
    10.0.0.0/8
    192.168.0.0/16
    172.16.0.0/12
cors_domains:
    *

[octoprint_compat]
# emula a API do OctoPrint em /api/* (mesma porta do Moonraker) para fatiadores
# que so falam OctoPrint (Creality Print, Cura). O nginx tambem encaminha /api/ na porta 80.
