# PRTouch (strain gauge) - sanidades portadas do PRTouch v2 da firmware oficial.
# ATENCAO: so habilitar depois de recompilar o MCU com CONFIG_WANT_HX71X.
# Uso: acrescentar  [include prtouch-strain.cfg]  ao printer.cfg.

[filter]
[dirzctl]

[hx711s]
sensor0_clk_pin: PA4          # pres0_clk_pins do firmware oficial
sensor0_sdo_pin: PC6          # pres0_sdo_pins do firmware oficial

[prtouch]
sensor_x: 32
sensor_y: 30
clr_noz_start_x: 15
clr_noz_start_y: 25
clr_noz_len_y: 15
s_hot_min_temp: 160
s_hot_max_temp: 200
s_bed_max_temp: 80
show_msg: True
wipe_retract_distance: 2

# calibracao medida na maquina: base 1-90, contato 1500-3800
min_hold: 1000
max_hold: 1500

# ── sanidades do v2 (firmware oficial) ─────────────────────────────────────
ck_sanity: True            # valor constante + pressao excessiva (aborta)
ck_noise_err: False        # ruido alto: so loga (True = aborta, key524)
ck_read_interval_err: False# intervalo > max_read_ms: so loga (True = aborta, key520)
press_max_factor: 10.0      # pressao > 2x max_hold => key525
pres_noise_max: 0.5        # ruido p2p > 50% de max_hold => aviso
max_read_ms: 11            # referencia do v2 (11 ms)
max_step_ratio: 1.5        # up_all > 1.5x comandado => aviso de perda de passo
